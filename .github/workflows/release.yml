name: Release package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Build a candidate without publishing
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/test.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm install --global npm@11.15.0
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: git diff --exit-code -- skill/whodunit/scripts/lib
      - run: node scripts/install-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate
          path: coreplane-whodunit-*.tgz
      - name: Verify release version
        if: github.event_name == 'release' || inputs.prepare_only == false
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF!=='refs/tags/v'+p.version)throw Error('Release tag must match the package version')"
      - name: Publish the verified artifact
        if: github.event_name == 'release' || inputs.prepare_only == false
        run: npm publish ./coreplane-whodunit-$(node -p "require('./package.json').version").tgz --access public --provenance
